<style id="v6-polish">
  :root { -webkit-tap-highlight-color: transparent; }
  html { height:100%; min-height:100%; background-color:var(--bg,#f5f6f8); }
  body { min-height:100vh; min-height:100dvh; background-color:var(--bg,#f5f6f8); overscroll-behavior-y:none; }
  button, a, input, select, textarea { touch-action:manipulation; }
  button { min-height:42px; }
  .card, .room-card, .summary-card, .stat-card { transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease; }
  button:active, .card:active, .room-card:active, .summary-card:active { transform:scale(.985); }
  input, select, textarea { font-size:16px; } /* prevents iOS Safari zoom */
  textarea { resize:vertical; }
  .v6-empty { padding:24px 16px; text-align:center; color:#6b7280; }
  .v6-priority { font-weight:700; }
  .v6-save-ok { animation:v6save .35s ease; }
  @keyframes v6save { 0%{opacity:.55; transform:scale(.98)} 100%{opacity:1; transform:scale(1)} }
</style>

      (refs.length?refs:['']).forEach(room=>actions.push({kind:'issue',room,text:hold?`Hold: ${problem}`:problem,pr:/\b(?:urgent|asap|immediately|emergency)\b|(?:επείγον|άμεσα|αμέσως)/iu.test(segment)||hold||soiling?'Urgent':'Normal'}));
    }
    if(status&&!refs.length&&!issue)actions.push({kind:'task',text:segment,time:dumpTime(segment)});
    if(!status&&!issue){
      if(refs.length&&!taskWords.test(segment))refs.forEach(room=>{if(configured.has(room))actions.push({kind:'note',room,text:dumpDetails(segment,refs)||segment,roomType:departure?'D':stayover?'S':S.today[room]?.t||'S'});else actions.push({kind:'issue',room,text:dumpDetails(segment,refs)||segment,pr:'Normal'})});
      else {const time=dumpTime(segment);actions.push({kind:'task',text:segment,time})}
    }
  }
  return actions;
}
function dumpTime(text){let m=text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);if(m)return `${m[1].padStart(2,'0')}:${m[2]}`;m=text.match(/\b(1[0-2]|0?[1-9])\s*(am|pm)\b/i);if(!m)return 'No time';let h=Number(m[1])%12+(m[2].toLowerCase()==='pm'?12:0);return `${String(h).padStart(2,'0')}:00`}

function applyDumpRoomUpdate(a){const now=Date.now(),existing=S.today[a.room]||{},roomType=a.roomType||existing.t||'S',r=Object.assign({p:false,note:''},existing,{t:roomType,st:a.status,f:0});for(const key of ['fx','h'])delete r[key];if(a.status==='todo'){for(const key of ['s','started','finished','inspected','ready','reinspect','m'])delete r[key]}
else if(a.status==='clean'){for(const key of ['finished','inspected','ready','reinspect','m'])delete r[key];r.s=now;r.started=now}

else if(a.status==='ready'){if(existing.st!=='clean'&&existing.st!=='insp'){r.s=now;r.started=now}r.finished=now;r.inspected=now;r.ready=now;r.m=Math.max(1,Math.floor((now-r.s)/60000))}

function buildDailySummary(recipient){
  const name=(recipient||'there').trim()||'there';
  const date=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const allRooms=list();
  const ready=allRooms.filter(r=>r.st==='ready').length;
  const worked=allRooms.filter(r=>['ready','insp','clean','fix'].includes(r.st)).length;
  const openIssues=S.issues.filter(i=>i.open);
  const doneTasks=S.tasks.filter(t=>t.done);
  const openTasks=S.tasks.filter(t=>!t.done);
  const doneRem=S.reminders.filter(r=>r.done);
  const priority=allRooms.filter(r=>r.p).map(r=>r.n);

  const issueLines=openIssues.length
    ? openIssues.slice(0,12).map(i=>`• ${i.room?`Room ${i.room} — `:''}${i.title||i.text||i.problem||'Issue'}`).join('\n')
    : '• No open issues';

  const taskLines=doneTasks.length
    ? doneTasks.slice(0,12).map(t=>`• ${t.text||t.title||'Task'}`).join('\n')
    : '• No tasks completed';

  const openTaskLines=openTasks.length
    ? openTasks.slice(0,12).map(t=>`• ${t.text||t.title||'Task'}`).join('\n')
    : '• None';

  return `Dear ${name},

Here’s the daily briefing for ${S.propertyName||'the environment'} — ${date}.

TODAY
• Rooms planned: ${allRooms.length}
• Rooms ready: ${ready}
• Rooms worked on: ${worked}
• Tasks completed: ${doneTasks.length}
• Reminders completed: ${doneRem.length}
${priority.length?`• Priority rooms: ${priority.join(', ')}`:''}

ISSUES
${issueLines}

TASKS COMPLETED
${taskLines}

OPEN TASKS
${openTaskLines}

Best,
${S.userName||'The team'}`;
}

  const allRooms=list();

  const worked=allRooms.filter(r=>['ready','insp','clean','fix'].includes(r.st)).length;
  const openIssues=S.issues.filter(i=>i.open);
  const doneTasks=S.tasks.filter(t=>t.done);

function setup(){sheet(`${head('Setup')}<div class="fld"><label>Property / hotel name</label><input id="prop" placeholder="e.g. My Hotel" value="${esc(S.propertyName||'')}"></div><div class="fld"><label>Housekeeper 1</label><input id="h0" value="${esc(S.hk[0])}"></div><div class="fld"><label>Housekeeper 2</label><input id="h1" value="${esc(S.hk[1])}"></div>${FL.map(([f,l])=>`<div class="fld"><label>${floorLabel(f,l)} rooms (separate with commas)</label><input id="fl${f}" value="${esc(S.floors[f].join(', '))}"></div>`).join('')}${roomAssignmentEditor()}<button class="btn f" onclick="saveSetup()">Save setup</button>
<div class="fld" style="margin-top:22px"><label>Backup — copy this text somewhere safe, or paste a backup here and restore</label><textarea id="bk">${esc(JSON.stringify(S))}</textarea></div><button class="btn s f" onclick="copyBackup()">Copy backup</button><button class="btn s f" onclick="restore()">Restore from pasted backup</button><button class="btn s f" onclick="if(confirm('Clear today\\'s list and statuses?')){S.today={};save();closeSheet();render()}">Clear today</button>`)}
function saveSetup(){const oldRooms=rooms(),selected=Object.fromEntries(oldRooms.map((r,i)=>[r.n,$('roomStaff'+i)?.value||'']));S.propertyName=$('prop').value.trim();S.hk=[$('h0').value.trim()||'Housekeeper 1',$('h1').value.trim()||'Housekeeper 2'];FL.forEach(([f])=>S.floors[f]=[...new Set($('fl'+f).value.split(',').map(v=>v.trim()).filter(Boolean))]);const valid=new Set(rooms().map(r=>r.n)),keep=map=>Object.fromEntries(Object.entries(isRecord(map)?map:{}).filter(([n])=>valid.has(n)));S.today=keep(S.today);S.plan=keep(S.plan);S.roomStaff=Object.fromEntries(rooms().flatMap(r=>{const v=selected[r.n];return v==='0'||v==='1'?[[r.n,+v]]:[]}));save();closeSheet();render();toast('Setup saved')}
async function copyBackup(){let v=$('bk').value;try{await navigator.clipboard.writeText(v);toast('Backup copied')}catch(e){$('bk').focus();$('bk').select();try{document.execCommand('copy');toast('Backup copied')}catch(e2){toast('Select and copy the backup')}}}
function restore(){try{let o=JSON.parse($('bk').value);if(!isRecord(o)||!isRecord(o.floors))throw 0;S=normalizeState(o);save();closeSheet();roll();render();toast('Backup restored')}catch(e){toast('That is not a valid backup')}}

function showBrief(){let L=list(),D=L.filter(r=>r.t==='D').length,pr=L.filter(r=>r.p).map(r=>r.n),oi=S.issues.filter(i=>i.open),ot=S.tasks.filter(t=>!t.done),hr=new Date().getHours(),g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
let fl=[...S.hk.map((name,i)=>({name,i})),{name:'Shared',i:null}].map(({name,i})=>{let a=L.filter(r=>staffIndex(r.f,r.n)===i);return a.length?'<div class="row" style="grid-template-columns:1fr auto"><strong>'+esc(name)+'</strong><span class="meta">'+a.filter(r=>r.t==='D').length+' dep · '+a.filter(r=>r.t==='S').length+' stay</span></div>':''}).join('');
$('brief').innerHTML=`<div class="bbox"><div class="brief-top"><button class="x" type="button" aria-label="Close daily briefing" onclick="closeBrief('home')">×</button></div><h1>${g}${S.userName?', '+esc(S.userName):''} 👋</h1><div class="meta">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
${L.length?`<div class="big">${L.length} rooms today</div><div class="meta">${D} departures · ${L.length-D} stayovers</div>${fl?`<div class="list" style="margin-top:14px">${fl}</div>`:''}
${pr.length?`<div class="sec"><h3>Priority rooms</h3><div class="panel"><strong>${pr.map(esc).join(', ')}</strong><div class="meta">Do these first.</div></div></div>`:''}${L.filter(r=>r.note).length?`<div class="sec"><h3>Special room notes</h3><div class="list">${L.filter(r=>r.note).map(r=>`<div class="row"><div class="no">${esc(r.n)}</div><div><strong>${esc(r.note)}</strong></div></div>`).join('')}</div></div>`:''}`:`<div class="hero" style="margin-top:14px"><h2>No rooms planned yet</h2><p>Mark today's departures and stayovers in Plan.</p></div>`}
${oi.length?`<div class="sec"><h3>Open issues</h3><div class="list">${oi.slice(0,4).map(i=>`<div class="row"><div class="no">${esc(i.room||'—')}</div><div><strong>${esc(i.text)}</strong><div class="meta">${i.pr}</div></div></div>`).join('')}</div></div>`:''}
${ot.length?`<div class="sec"><h3>Tasks</h3><div class="list">${ot.slice(0,4).map(t=>`<div class="row" style="grid-template-columns:1fr auto"><strong>${esc(t.text)}</strong><span class="meta">${esc(t.time)}</span></div>`).join('')}</div></div>`:''}
<button class="btn f" onclick="closeBrief('${L.length?'rooms':'plan'}')">${L.length?'Start the day':'Plan rooms'}</button><button class="btn s f" onclick="openDailyExport()">Share daily briefing</button></div>`;$('brief').classList.add('on')}
function closeBrief(p){$('brief').classList.remove('on');S.brief=S.day;save();go(p||cur)}
const hasLocalData=hasStoredState();
S=load();S.reminders=S.reminders||[];S.tasks=S.tasks||[];S.issues=S.issues||[];roll();render();
if(!hasLocalData || !S.userName || !S.propertyName){onboarding(!S.userName?1:2)}
else if(!rooms().length)setup();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>


<script id="v6-hardening">
(function(){
  const SNAP_KEY='housekeeping_planner_last_snapshot';
  function snapshot(){
    try{
      const raw=localStorage.getItem(KEY)||localStorage.getItem(ALT_KEY);
      if(raw) localStorage.setItem(SNAP_KEY,JSON.stringify({savedAt:new Date().toISOString(),data:raw}));
    }catch(e){}
  }
  window.addEventListener('pagehide',snapshot);
  window.addEventListener('beforeunload',snapshot);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')snapshot();});
})();
</script>
<style id="v7-fixes-css">.x{min-height:34px}.mini{min-height:0}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}</style>
<script id="v7-fixes">
(function(){
act=function(n,w){let r=S.today[n];if(!r)return;
if(w==='start'||w==='redo'){r.st='clean';r.s=Date.now();r.started=r.started||r.s;delete r.dump}
else if(w==='finish'){r.finished=Date.now();r.m=Math.max(1,Math.floor((r.finished-r.s)/60000));if(r.t==='D')r.st='insp';else{r.st='ready';r.ready=Date.now();done(n)}}
else if(w==='reinsp'){r.st='insp';r.reinspect=Date.now()}
save();closeSheet();render();toast(w==='start'?'Cleaning started':'Saved')};
done=function(n){let r=S.today[n];if(!r||r.h)return;r.h=1;r.ready=r.ready||Date.now();if(r.dump)return;
let turn=r.t==='D'&&r.started?Math.max(0,Math.floor((r.ready-r.started)/60000)):0,staffId=staffIndex(floorOf(n),n);
S.hist.push({d:S.day,room:n,t:r.t,m:r.m||0,f:r.f||0,started:r.started||0,finished:r.finished||0,inspected:r.inspected||0,ready:r.ready||0,turn,staffId,staff:owner(floorOf(n),n)})};
applyDumpRoomUpdate=function(a){const now=Date.now(),ex=S.today[a.room]||{},t=a.roomType||ex.t||'S';let st=a.status;if(st==='insp'&&t==='S')st='ready';
const r=Object.assign({p:false,note:''},ex,{t,st,f:0});['fx','h','dump'].forEach(k=>delete r[k]);
if(st==='todo'){['s','started','finished','inspected','ready','reinspect','m'].forEach(k=>delete r[k])}
else if(st==='clean'){['finished','inspected','ready','reinspect','m'].forEach(k=>delete r[k]);r.s=now;r.started=now}
else{if(ex.st==='clean'&&ex.s){r.finished=now;r.m=Math.max(1,Math.floor((now-ex.s)/60000))}else{r.dump=1;delete r.m}
if(st==='insp'){['inspected','ready','reinspect'].forEach(k=>delete r[k])}else{r.inspected=now;r.finished=r.finished||now}}
S.today[a.room]=r;if(st==='ready')done(a.room)};
const _org=organizeDumpInfo,verb=/^(?:hold:\s*)?(?:bring|take|deliver|replace|restock|buy|pick up|order|prepare|call|tell|ask|send|check|remind|leave|put|add)\b/i,defect=/\b(?:broken|not working|doesn'?t work|does not work|leak\w*|clog\w*|block\w*|damag\w*|repair\w*|problem|issue)\b/i;
organizeDumpInfo=function(t){return _org(String(t||'').replace(/(\d)\.(\d{2})\b/g,'$1:$2')).map(a=>{
if(a.kind==='issue'&&verb.test(a.text.trim())&&!defect.test(a.text)){const x=(a.room?'Room '+a.room+': ':'')+a.text.replace(/^hold:\s*/i,'');return{kind:'task',text:x,time:dumpTime(x)}}return a})};
const _render=render;render=function(){_render();try{const h=$('home'),or=S.reminders.filter(r=>!r.done).slice(0,3),
rows=or.map(r=>`<div class="row"><div>🔔</div><div><strong>${esc(r.text)}</strong><div class="meta">${esc(r.time||'No time')}</div></div></div>`).join(''),
sec=[...h.querySelectorAll('.sec')].find(s=>s.querySelector('h3')&&s.querySelector('h3').textContent==='Needs attention');
if(sec){const l=sec.querySelector('.list');if(rows)l.insertAdjacentHTML('beforeend',rows);else if(!l.children.length)sec.remove()}
else if(rows)h.insertAdjacentHTML('beforeend',`<div class="sec"><h3>Needs attention</h3><div class="list">${rows}</div></div>`)}catch(e){}};
render();
const _sb=showBrief;showBrief=function(){_sb();try{const or=S.reminders.filter(r=>!r.done).slice(0,4),b=$('brief').querySelector('.btn.f');
if(or.length&&b)b.insertAdjacentHTML('beforebegin',`<div class="sec"><h3>Reminders</h3><div class="list">${or.map(r=>`<div class="row" style="grid-template-columns:1fr auto"><strong>${esc(r.text)}</strong><span class="meta">${esc(r.time||'No time')}</span></div>`).join('')}</div></div>`)}catch(e){}};
const _sp=setPlan;setPlan=function(n,t){const r=S.today[n];if(pf==='today'&&r&&r.t===t&&r.st&&r.st!=='todo'&&!confirm('Remove room '+n+' from today? Its progress will be lost.'))return;_sp(n,t)};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;const d=S.day;roll();if(S.day!==d){render();if(S.userName&&S.propertyName&&rooms().length){closeSheet();showBrief()}}});
if(S.userName&&S.propertyName&&rooms().length){if(S.brief!==S.day)showBrief();else showDumpPrompt()}
})();
</script>
