<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--card:#1c222b;--soft:#28303b;--soft2:#232a34;--navbg:rgba(28,34,43,.96);--bg:#12171d;--ink:#e8ecf1;--mu:#8f99a6;--ln:#2b333d;--bl2:#1f2d52;--gr2:#17332a;--rd2:#3a2020;--pu2:#2c2650;--sh:none}}:root[data-theme=dark]{--card:#1c222b;--soft:#28303b;--soft2:#232a34;--navbg:rgba(28,34,43,.96);--bg:#12171d;--ink:#e8ecf1;--mu:#8f99a6;--ln:#2b333d;--bl2:#1f2d52;--gr2:#17332a;--rd2:#3a2020;--pu2:#2c2650;--sh:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:900px;margin:auto;padding:0 14px 96px;padding-top:env(safe-area-inset-top)}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 0 10px}.title{font-size:25px;font-weight:800}.date{font-size:13px;color:var(--mu)}
.icon{width:43px;height:43px;border:1px solid var(--ln);border-radius:14px;background:var(--card);font-size:18px;margin-left:6px}
.page{display:none}.page.on{display:block}
.hero,.panel,.list,.stat{background:var(--card);border:1px solid var(--ln);border-radius:18px;box-shadow:var(--sh)}
.hero{padding:18px;margin-bottom:14px}.hero h2{margin:0 0 5px;font-size:20px}.hero p,.meta{color:var(--mu);font-size:12px;margin:0}.meta{margin-top:3px}
.btn{background:var(--bl);color:#fff;border:0;border-radius:13px;padding:11px 15px;font-weight:700}.btn.s{background:var(--soft);color:var(--ink)}.btn.g{background:var(--gr)}.btn.r{background:var(--rd)}.btn.f{width:100%;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{cursor:pointer;text-align:left;transition:transform .08s,background .08s;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:13px;box-shadow:var(--sh)}.metric:active{transform:scale(.98);background:var(--soft)}.metric b{display:block;font-size:24px;margin-top:6px}.metric span{font-size:11px;color:var(--mu)}
.sec{margin-top:20px}.sec h3{font-size:16px;margin:0 0 8px}.list{overflow:hidden}.panel{padding:14px}
.row{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.no{font-size:18px;font-weight:800}.fix-issue-text{overflow-wrap:anywhere}
.pill{padding:5px 8px;border-radius:9px;font-size:10px;font-weight:800;white-space:nowrap}
.todo{background:var(--or2);color:#a66a12}.clean{background:var(--bl2);color:#3862ce}.insp{background:var(--pu2);color:#6c53bd}.fix{background:var(--rd2);color:#b13c3c}.ready{background:var(--gr2);color:var(--gr)}
.seg{display:flex;background:var(--soft2);padding:3px;border-radius:12px;overflow:auto;margin-bottom:12px}.seg button{background:none;border:0;padding:8px 10px;border-radius:9px;font-size:11px;white-space:nowrap}.seg .on{background:var(--card);font-weight:800}
.chk{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln)}.chk input{width:22px;height:22px}
.mini{border:0;background:var(--soft);border-radius:9px;padding:8px 10px;font-size:11px;font-weight:700}.mini.on{background:var(--bl);color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--navbg);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:30}
.nav button{border:0;background:none;color:var(--mu);font-size:10px;padding:6px}.nav b{display:block;font-size:19px}.nav .on{color:var(--bl);font-weight:800}
.ov{display:none;position:fixed;inset:0;background:rgba(18,24,34,.42);z-index:60;align-items:flex-end}.ov.on{display:flex}
.sheet{width:min(680px,100%);margin:auto;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.sh{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0;font-size:21px}.x{width:34px;height:34px;border:0;border-radius:50%;background:var(--soft);font-size:18px}
.fld{margin-top:10px}.fld label{display:block;font-size:11px;color:var(--mu);font-weight:700;margin-bottom:4px}.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--ln);background:var(--soft);border-radius:10px;padding:10px}.fld textarea{min-height:70px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:15px}.stat b{font-size:25px}.stat p{margin:4px 0 0;font-size:11px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:93px;transform:translateX(-50%);background:#17202a;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.on{opacity:1}
.brief{display:none;position:fixed;inset:0;background:var(--bg);z-index:80;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}.brief.on{display:block}.bbox{max-width:560px;margin:auto}.bbox h1{font-size:28px;margin:0 0 4px}.big{font-size:34px;font-weight:850;margin:14px 0 2px}
.brief-top{display:flex;justify-content:flex-end;margin:-4px 0 8px}.task-actions{display:flex;gap:5px}.task-actions .mini{padding:7px 9px}
.dump-entry{min-height:126px;line-height:1.45}.dump-preview{margin-top:12px;padding:12px;background:var(--soft);border-radius:12px}.dump-group+.dump-group{margin-top:10px}.dump-group h3{font-size:12px;margin:0 0 5px}.dump-item{padding:7px 0;border-top:1px solid var(--ln)}.dump-item:first-of-type{border-top:0}.dump-apply:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}}
</style>
<style id="v6-polish">
  :root { -webkit-tap-highlight-color: transparent; }
  html { height:100%; min-height:100%; background-color:var(--bg,#f5f6f8); }
  body { min-height:100vh; min-height:100dvh; background-color:var(--bg,#f5f6f8); overscroll-behavior-y:none; }
  button, a, input, select, textarea { touch-action:manipulation; }
  button { min-height:42px; }
  .card, .room-card, .summary-card, .stat-card { transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease; }
  button:active, .card:active, .room-card:active, .summary-card:active { transform:scale(.985); }
  input, select, textarea { font-size:16px; } /* prevents iOS Safari zoom */
  textarea { resize:vertical; }
  .v6-empty { padding:24px 16px; text-align:center; color:#6b7280; }
  .v6-priority { font-weight:700; }
  .v6-save-ok { animation:v6save .35s ease; }
  @keyframes v6save { 0%{opacity:.55; transform:scale(.98)} 100%{opacity:1; transform:scale(1)} }
</style>
</head><body>
<div class="app">
<header class="top"><div><div class="title" id="title">Home</div><div class="date" id="date"></div></div><div><button class="icon" onclick="quick()">＋</button><button class="icon" onclick="setup()">⚙</button></div></header>
<section id="home" class="page on"></section>
<section id="rooms" class="page"></section>
<section id="plan" class="page"></section>
<section id="tasks" class="page"></section>
<section id="issues" class="page"></section>
<section id="reminders" class="page"></section>
<section id="stats" class="page"></section>
</div>
<nav class="nav"><button data-p="home" class="on" onclick="go('home')"><b>⌂</b>Home</button><button data-p="rooms" onclick="go('rooms')"><b>▦</b>Rooms</button><button data-p="plan" onclick="go('plan')"><b>◷</b>Plan</button><button data-p="tasks" onclick="go('tasks')"><b>✓</b>Tasks</button><button data-p="stats" onclick="go('stats')"><b>⌁</b>Stats</button></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div><div class="brief" id="brief"></div>
<script>
const KEY='stay365_pwa_v5_2',ALT_KEY='housekeeping_planner_v6_3',FL=[['G','Ground'],['1','1st floor'],['2','2nd floor']],CHK=['Bed made, linen fresh','Bathroom clean, towels set','Floors vacuumed / washed','Surfaces dusted, no marks','Trash out, amenities restocked','Nothing broken or left behind'],ST={todo:'To do',clean:'Cleaning',insp:'To inspect',fix:'Fix needed',ready:'Ready'};
const blank=()=>({userName:'',propertyName:'',hk:['Housekeeper 1','Housekeeper 2'],floors:{G:[],1:[],2:[]},day:'',brief:'',planReady:false,plan:{},today:{},hist:[],issues:[],tasks:[],reminders:[]});
let S,cur='home',flt='all',pf='tomorrow';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isRecord=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const textValue=v=>typeof v==='string'?v:'';
function normalizeState(value){
  const o=isRecord(value)?value:{},base=blank(),sourceFloors=isRecord(o.floors)?o.floors:{};
  const floors=Object.fromEntries(FL.map(([f])=>[f,[...new Set((Array.isArray(sourceFloors[f])?sourceFloors[f]:[]).filter(v=>typeof v==='string').map(v=>v.trim()).filter(Boolean))]]));
  const validRooms=new Set(Object.values(floors).flat());
  const roomMap=(value,withStatus)=>Object.fromEntries(Object.entries(isRecord(value)?value:{}).filter(([name,r])=>validRooms.has(name)&&isRecord(r)&&(r.t==='D'||r.t==='S')).map(([name,r])=>{
    const item={...r,t:r.t,p:!!r.p,note:textValue(r.note)};
    if(withStatus){item.st=Object.prototype.hasOwnProperty.call(ST,r.st)?r.st:'todo';item.f=Number.isFinite(+r.f)?Math.max(0,Math.floor(+r.f)):0;item.fx=textValue(r.fx);for(const key of ['s','started','finished','inspected','ready','reinspect','m'])if(key in r)item[key]=Number.isFinite(+r[key])?+r[key]:0;if(item.st==='clean'&&!item.s)item.s=Date.now();item.h=!!r.h}
    return [name,item];
  }));
  const records=value=>Array.isArray(value)?value.filter(isRecord):[];
  const hk=Array.isArray(o.hk)?[0,1].map(i=>textValue(o.hk[i]).trim()||base.hk[i]):base.hk;
  return Object.assign(base,o,{
    userName:textValue(o.userName),propertyName:textValue(o.propertyName),hk,floors,
    day:textValue(o.day),brief:textValue(o.brief),planReady:!!o.planReady,
    plan:roomMap(o.plan,false),today:roomMap(o.today,true),
    hist:records(o.hist).map(x=>({...x,room:textValue(x.room),t:x.t==='D'?'D':'S',m:Number.isFinite(+x.m)?+x.m:0,f:Number.isFinite(+x.f)?+x.f:0,turn:Number.isFinite(+x.turn)?+x.turn:0})),
    issues:records(o.issues).map(x=>({...x,room:textValue(x.room),text:textValue(x.text),pr:['Normal','Urgent','Low'].includes(x.pr)?x.pr:'Normal',open:x.open!==false,when:textValue(x.when)})),
    tasks:records(o.tasks).map(x=>({...x,text:textValue(x.text??x.title),time:textValue(x.time)||'No time',done:!!x.done})),
    reminders:records(o.reminders).map(x=>({...x,text:textValue(x.text??x.title),time:textValue(x.time),done:!!x.done}))
  });
}
function load(){
  let saved=[];
  try{saved=[localStorage.getItem(ALT_KEY),localStorage.getItem(KEY)].filter(Boolean)}catch(e){return blank()}
  const loaded=[];
  for(const raw of saved){try{const parsed=JSON.parse(raw);if(isRecord(parsed))loaded.push(normalizeState(parsed))}catch(e){}}
  const hasContent=s=>!!(s.userName||s.propertyName||Object.values(s.floors).some(a=>a.length)||Object.keys(s.today).length||Object.keys(s.plan).length||s.hist.length||s.issues.length||s.tasks.length||s.reminders.length);
  return loaded.find(hasContent)||loaded[0]||blank();
}
function hasStoredState(){try{return !!(localStorage.getItem(KEY)||localStorage.getItem(ALT_KEY))}catch(e){return false}}
const save=()=>{try{const raw=JSON.stringify(S);localStorage.setItem(KEY,raw);localStorage.setItem(ALT_KEY,raw)}catch(e){}};
function toast(m){let t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
function roll(){let d=new Date().toDateString();if(S.day!==d){S.today={};for(const r in S.plan)S.today[r]=Object.assign({},S.plan[r],{st:'todo',f:0});S.plan={};S.planReady=false;S.tasks=S.tasks.filter(t=>!t.done);S.reminders=S.reminders.filter(r=>!r.done);S.day=d;save()}}
const rooms=()=>FL.flatMap(([f])=>S.floors[f].map(n=>({n,f})));
const floorOf=n=>(rooms().find(r=>r.n===n)||{}).f;
const owner=f=>f==='1'?S.hk[0]:f==='2'?S.hk[1]:'Shared';
const list=()=>Object.keys(S.today).map(n=>Object.assign({n,f:floorOf(n)},S.today[n])).sort((a,b)=>rooms().findIndex(r=>r.n===a.n)-rooms().findIndex(r=>r.n===b.n));
const tl=t=>t==='D'?'Departure':'Stayover',el=r=>Math.max(1,Math.floor((Date.now()-r.s)/60000)),pill=r=>`<span class="pill ${r.st}">${ST[r.st]}</span>`;
function go(p){if($('brief').classList.contains('on')){$('brief').classList.remove('on');S.brief=S.day;save()}cur=p;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.p===p));$('title').textContent={home:'Home',rooms:'Rooms',plan:'Plan',tasks:'Tasks',issues:'Issues',stats:'Stats',reminders:'Reminders'}[p];render();scrollTo(0,0)}
function jsArg(v){return esc(JSON.stringify(String(v)))}
function rrow(r){let m=r.st==='clean'?el(r)+' min so far':r.st==='fix'?esc(r.fx):r.st==='insp'?owner(r.f)+' · Inspection needed':owner(r.f),action=r.st==='insp'?`<button class="mini on" aria-label="Inspect room ${esc(r.n)}" onclick="event.stopPropagation();openRoom(${jsArg(r.n)})">Inspect</button>`:pill(r);return `<div class="row" onclick="openRoom(${jsArg(r.n)})"><div class="no">${esc(r.n)}</div><div><strong>${tl(r.t)}${r.p?' · Priority':''}</strong><div class="meta">${m}</div></div>${action}</div>`}
function render(){$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
let L=list(),rd=L.filter(r=>r.st==='ready').length,oi=S.issues.filter(i=>i.open),ot=S.tasks.filter(t=>!t.done),or=S.reminders.filter(r=>!r.done).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
// home
let prog=[['1',S.hk[0]+' · 1st floor'],['2',S.hk[1]+' · 2nd floor'],['G','Ground floor · shared']].map(([f,l])=>{let a=L.filter(r=>r.f===f);return a.length?`<div class="row"><div></div><div><strong>${esc(l)}</strong><div class="meta">${a.filter(r=>r.st==='ready').length} of ${a.length} ready</div></div></div>`:''}).join('');
let q=L.filter(r=>r.st==='insp'||r.st==='fix');
$('home').innerHTML=`<div class="hero">${S.propertyName?`<div class="eyebrow">${esc(S.propertyName)}</div>`:''}<h2>${L.length?`${rd} of ${L.length} rooms ready`:'No rooms planned for today'}</h2><p>${L.filter(r=>r.t==='D').length} departures · ${L.filter(r=>r.t==='S').length} stayovers${S.planReady?' · ✓ Tomorrow was prepared':' '}</p>${L.length?'':'<button class="btn f" onclick="go(\'plan\')">Plan rooms</button>'}${!S.propertyName?'<button class="btn s f" onclick="setup()">Set property name</button>':''}<button class="btn s f" onclick="openDailyExport()">Export daily summary</button><button class="btn s f" onclick="showBrief()">Daily briefing</button></div>
<div class="grid"><div class="metric" onclick="go('rooms')"><span>🧹 Ready</span><b>${rd}/${L.length}</b><small class="meta">Rooms →</small></div><div class="metric" onclick="go('issues')"><span>⚠️ Issues</span><b>${oi.length}</b><small class="meta">Attention →</small></div><div class="metric" onclick="go('tasks')"><span>✅ Tasks</span><b>${ot.length}</b><small class="meta">To do →</small></div><div class="metric" onclick="go('reminders')"><span>🔔 Reminders</span><b>${S.reminders.filter(x=>!x.done).length}</b><small class="meta">Today →</small></div></div>
${Object.keys(S.plan).length?`<div class="panel" style="margin-top:12px;cursor:pointer" onclick="go('plan')"><strong>Tomorrow</strong><div class="meta" style="margin-top:4px">${Object.values(S.plan).filter(r=>r.t).length} rooms planned · ${S.planReady?'✓ Ready':'Still needs planning'} · Tap to review</div></div>`:''}
${prog?`<div class="sec"><h3>Progress</h3><div class="list">${prog}</div></div>`:''}
${q.length?`<div class="sec"><h3>Waiting for you</h3><div class="list">${q.map(rrow).join('')}</div></div>`:''}
${oi.length||ot.length||or.length?`<div class="sec"><h3>Needs attention</h3><div class="list">${oi.slice(0,3).map(i=>`<div class="row"><div class="no">${esc(i.room||'—')}</div><div><strong>${esc(i.text)}</strong><div class="meta">${i.pr}</div></div></div>`).join('')}${ot.slice(0,3).map(t=>`<div class="row"><div>✓</div><div><strong>${esc(t.text)}</strong><div class="meta">${esc(t.time)}</div></div></div>`).join('')}</div></div>`:''}`;
// rooms
let fs=[['all','All'],['todo','To do'],['clean','Cleaning'],['insp','To inspect'],['fix','Fix needed'],['ready','Ready']],roomRows=L.filter(r=>flt==='all'||r.st===flt),fixIssues=flt==='fix'?S.issues.map((i,k)=>({i,k})).filter(({i})=>i.open):[],issueRows=fixIssues.map(({i,k})=>`<div class="row" style="grid-template-columns:50px minmax(0,1fr) auto"><div class="no">${esc(i.room||'—')}</div><div style="min-width:0"><strong class="fix-issue-text">${esc(i.text)}</strong><div class="meta">Reported issue · ${esc(i.pr)} · ${esc(i.when)}</div></div><button class="mini on" aria-label="Mark issue fixed" onclick="markIssueFixed(${k})">Fixed</button></div>`).join('');
$('rooms').innerHTML=`<div class="seg">${fs.map(([k,l])=>`<button class="${flt===k?'on':''}" onclick="flt='${k}';render()">${l}</button>`).join('')}</div>${flt==='fix'?`<div class="list">${roomRows.map(rrow).join('')}${issueRows}${roomRows.length||fixIssues.length?'':'<div class="row"><div></div><div class="meta">No rooms or open issues need attention.</div></div>'}</div>`:L.length?`<div class="list">${roomRows.map(rrow).join('')||'<div class="row"><div></div><div class="meta">No rooms with this status.</div></div>'}</div>`:'<div class="hero"><h2>Nothing planned</h2><p>Mark departures and stayovers in Plan.</p></div>'}`;
// plan
let P=pf==='today'?S.today:S.plan;
let planned=Object.entries(P).filter(([n,r])=>r.t),dep=planned.filter(([n,r])=>r.t==='D'),stay=planned.filter(([n,r])=>r.t==='S'),pri=planned.filter(([n,r])=>r.p),notes=planned.filter(([n,r])=>r.note&&r.note.trim());
let H2=S.hist.slice(-120),avgFor=t=>{let a=H2.filter(x=>x.t===t&&x.m);return a.length?Math.round(a.reduce((s,x)=>s+x.m,0)/a.length):0},est=avgFor('D')*dep.length+avgFor('S')*stay.length;
$('plan').innerHTML=`<div class="seg"><button class="${pf==='tomorrow'?'on':''}" onclick="pf='tomorrow';render()">Tomorrow</button><button class="${pf==='today'?'on':''}" onclick="pf='today';render()">Today</button></div>
<div class="hero"><h2>${pf==='tomorrow'?'Prepare tomorrow':"Today's plan"}</h2><p>${pf==='tomorrow'?'Set the workload tonight. The morning briefing will use this plan.':'Changes here apply to today right away.'}</p><div class="grid" style="margin-top:12px"><div class="metric"><span>🧹 Rooms</span><b>${planned.length}</b><small class="meta">${dep.length} departures · ${stay.length} stayovers</small></div><div class="metric"><span>★ Priority</span><b>${pri.length}</b><small class="meta">rooms</small></div><div class="metric"><span>📝 Notes</span><b>${notes.length}</b><small class="meta">special instructions</small></div><div class="metric"><span>⏱️ Est.</span><b>${est?est+'m':'—'}</b><small class="meta">from your history</small></div></div>${pf==='tomorrow'?`<button class="btn ${S.planReady?'g':'f'}" onclick="togglePlanReady()">${S.planReady?'✓ Tomorrow is ready':'✓ Mark tomorrow ready'}</button>${S.planReady?'<div class="meta" style="margin-top:8px">Plan ready — you can still edit it anytime.</div>':''}`:''}</div>
${rooms().length?FL.map(([f,l])=>S.floors[f].length?`<div class="sec" style="margin-top:14px"><h3>${l} · ${owner(f)}</h3><div class="list">${S.floors[f].map(n=>planRow(n,P)).join('')}</div></div>`:'').join(''):'<div class="hero"><h2>Add your rooms first</h2><button class="btn f" onclick="setup()">Open setup</button></div>'}`;

function escapeRegex(v){return String(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function dumpRoomRefs(text,roomContext){
  const found=new Set(),configured=rooms().map(r=>r.n).sort((a,b)=>b.length-a.length);
  configured.forEach(n=>{if(new RegExp(`(^|[^\\p{L}\\p{N}])${escapeRegex(n)}(?=$|[^\\p{L}\\p{N}])`,'iu').test(text))found.add(n)});
  if(!found.size)for(const m of text.matchAll(/(?:room|suite|δωμάτιο|δωμ\.?)\s*([a-z]?\d{1,4}[a-z]?)/giu))found.add(m[1]);
  if(!found.size&&roomContext){const clean=text.replace(/\b\d{1,2}:\d{2}\b/g,' ');for(const m of clean.matchAll(/\b(?:[a-z]?\d{2,4}[a-z]?)\b/giu))found.add(m[0])}
  return [...found];
}
function dumpSegments(text){
  const known=rooms().map(r=>r.n.toLowerCase()),taskStart=/^(?:bring|take|deliver|replace|restock|buy|pick up|order|prepare|call|tell|ask|send|check|remind|leave|put|add|φέρε|φέρτε|βάλε|βάλτε|ανέβασε|αγόρασε|πάρε|παραγγείλε|έλεγξε|τσεκάρισε|ενημέρωσε|άφησε|δώσε|τηλεφώνησε|στείλε|ετοίμασε)/iu,out=[];
  const lines=String(text||'').split(/[\r\n.!?;]+/u);
  for(const line of lines){let current='';for(const part of line.split(',')){const value=part.trim(),lower=value.toLowerCase(),startsRoom=known.some(n=>lower===n||lower.startsWith(n+' '))||/^(?:room|suite|δωμάτιο|δωμ\.?)\s/i.test(value)||/^\d{3,4}\b/u.test(value);if(current&&(startsRoom||taskStart.test(value))){out.push(current.trim());current=value}else current=current?current+', '+value:value}if(current.trim())out.push(current.trim())}
  return out.filter(Boolean);
}
function dumpDetails(text,refs){
  let details=text;
  refs.forEach(room=>{const token=new RegExp('(^|[^\\p{L}\\p{N}])'+escapeRegex(room)+'(?=$|[^\\p{L}\\p{N}])','giu');details=details.replace(token,' ')});
  return details.replace(/\b(?:room|suite|δωμάτιο|δωμ\.?)\b/giu,' ').replace(/^(?:στο|στη|στον|το)\s+/iu,'').replace(/^[\s,:;–—-]+|[\s,:;–—-]+$/gu,'').trim();
}
function organizeDumpInfo(text){
  const actions=[],segments=dumpSegments(text);
  const issueWords=/(?:\bbroken\b|\bdoes(?:n't| not) work\b|\bnot working\b|\bmalfunction\w*\b|\bleak\w*\b|\bdamag\w*\b|\bblock\w*\b|\bclogg\w*\b|\brepair\w*\b|\bissue\b|\bproblem\b|\bac\b|\bair[ -]?condition\w*\b|\bhot water\b|\btoilet\b|\bshower\b|\bwifi\b|\binternet\b|χαλασ|δεν δουλεύ|δε δουλεύ|δεν λειτουργ|διαρρο|σπασ|βλάβ|πρόβλη|προβλη|κλιματισ|επισκευ|δεν ανοίγ|δεν κλείν)/iu;
  const soilingWords=/\bxest(?:i|h)?ke\b/iu;
  const holdWords=/(?:\bdo not enter\b|\bdon['’]?t enter\b|\bno entry\b|\bdnd\b|\bdo not disturb\b|μην\s+(?:το\s+)?(?:δώσετε|δώσεις|δώσουμε|μπει|μπείτε|καθαρίσει|καθαρίσετε)|μην\s+μπειτε)/iu;
  const taskWords=/(?:\b(?:bring|take|deliver|replace|restock|buy|pick up|order|prepare|call|tell|ask|send|check|remind|leave|put|add)\b|φέρε|φέρτε|βάλε|βάλτε|ανέβασε|αγόρασε|πάρε|παραγγείλε|έλεγξε|τσεκάρισε|ενημέρωσε|άφησε|δώσε|τηλεφώνησε|στείλε|ετοίμασε)/iu;
  for(const segment of segments){
    const ready=/\b(?:passed inspection|inspection passed|inspected and ready|ready for guests)\b|(?:πέρασε τον έλεγχο|ελέγχθηκε και είναι έτοιμ)/iu.test(segment);
    const cleaned=/\b(?:cleaned|is clean|now clean|finished cleaning|cleaning is done|cleaning started|ready for inspection|needs inspection|to inspect)\b|(?:καθαρίστ|έτοιμο για έλεγχο|για επιθεώρηση)/iu.test(segment);
    const cleaning=/\b(?:cleaning now|started cleaning|start cleaning|cleaning in progress|is cleaning)\b|(?:ξεκίνησε καθαρισ|καθαρίζεται τώρα|καθαρίζουν τώρα)/iu.test(segment);
    const needsClean=/\b(?:needs? (?:to be )?clean(?:ed|ing)?|dirty|checkout|check out|check-out|departure|departing|checked out|vacated)\b|(?:θέλει καθαρισ|χρειάζεται καθαρισ|για καθάρισμα|αναχώρηση|έφυγε|βρώμικ)/iu.test(segment);
    const soiling=soilingWords.test(segment),issue=issueWords.test(segment)||holdWords.test(segment)||soiling,status=ready?'ready':needsClean?'todo':cleaned?'insp':cleaning?'clean':'';
    const refs=dumpRoomRefs(segment,!!(status||issue||taskWords.test(segment)));
    const configured=new Set(rooms().map(r=>r.n)),departure=/\b(?:checkout|check out|check-out|departure|departing|checked out|vacated)\b|(?:αναχώρηση|έφυγε)/iu.test(segment),stayover=/\b(?:stayover|stay over|occupied|in-house)\b|(?:παραμονή|διαμένει)/iu.test(segment);
    if(status&&refs.length)refs.forEach(room=>{if(configured.has(room)){const roomType=departure?'D':stayover?'S':S.today[room]?.t||'S';actions.push({kind:'room',room,status,roomType})}else if(!issue)actions.push({kind:'issue',room,text:segment,pr:'Normal'})});
    if(issue){
      const details=dumpDetails(segment,refs);
      const hold=holdWords.test(segment),problem=soiling?'Soiling / sanitation clean-up required':details||segment;
      (refs.length?refs:['']).forEach(room=>actions.push({kind:'issue',room,text:hold?`Hold: ${problem}`:problem,pr:/\b(?:urgent|asap|immediately|emergency)\b|(?:επείγον|άμεσα|αμέσως)/iu.test(segment)||hold||soiling?'Urgent':'Normal'}));
    }
    if(status&&!refs.length&&!issue)actions.push({kind:'task',text:segment,time:dumpTime(segment)});
    if(!status&&!issue){
      if(refs.length&&!taskWords.test(segment))refs.forEach(room=>{if(configured.has(room))actions.push({kind:'note',room,text:dumpDetails(segment,refs)||segment,roomType:departure?'D':stayover?'S':S.today[room]?.t||'S'});else actions.push({kind:'issue',room,text:dumpDetails(segment,refs)||segment,pr:'Normal'})});
      else {const time=dumpTime(segment);actions.push({kind:'task',text:segment,time})}
    }
  }
  return actions;
}
function dumpTime(text){let m=text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);if(m)return `${m[1].padStart(2,'0')}:${m[2]}`;m=text.match(/\b(1[0-2]|0?[1-9])\s*(am|pm)\b/i);if(!m)return 'No time';let h=Number(m[1])%12+(m[2].toLowerCase()==='pm'?12:0);return `${String(h).padStart(2,'0')}:00`}
function dumpActionLabel(a){if(a.kind==='room')return `Room ${a.room} · ${a.roomType==='D'?'Departure':'Stayover'} · ${a.status==='todo'?'Needs cleaning':a.status==='clean'?'Cleaning started':a.status==='insp'?'Needs inspection':'Marked ready'}`;if(a.kind==='note')return `Room ${a.room} · Note · ${a.text}`;if(a.kind==='issue')return `${a.room?`Room ${a.room}`:'Area'} · ${a.text} · ${a.pr}`;return `Task · ${a.text}${a.time!=='No time'?` · ${a.time}`:''}`}
function renderDumpPreview(){const target=$('dumpPreview'),button=$('dumpApply');if(!target||!button)return;const actions=organizeDumpInfo($('dumpInput')?.value||''),groups=[['Room updates',actions.filter(a=>a.kind==='room')],['Room notes',actions.filter(a=>a.kind==='note')],['Issues',actions.filter(a=>a.kind==='issue')],['Tasks',actions.filter(a=>a.kind==='task')]].filter(([,items])=>items.length);target.innerHTML=groups.length?groups.map(([title,items])=>`<div class="dump-group"><h3>${title} · ${items.length}</h3>${items.map(a=>`<div class="dump-item">${esc(dumpActionLabel(a))}</div>`).join('')}</div>`).join(''):'<div class="meta">Your organized updates will appear here.</div>';button.disabled=!actions.length}

function buildDailySummary(recipient){
  const name=(recipient||'there').trim()||'there';
  const date=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const allRooms=list();
  const ready=allRooms.filter(r=>r.st==='ready').length;
  const worked=allRooms.filter(r=>['ready','insp','clean','fix'].includes(r.st)).length;
  const openIssues=S.issues.filter(i=>i.open);
  const doneTasks=S.tasks.filter(t=>t.done);
  const openTasks=S.tasks.filter(t=>!t.done);
  const doneRem=S.reminders.filter(r=>r.done);
  const priority=allRooms.filter(r=>r.p).map(r=>r.n);

  const issueLines=openIssues.length
    ? openIssues.slice(0,12).map(i=>`• ${i.room?`Room ${i.room} — `:''}${i.title||i.text||i.problem||'Issue'}`).join('\n')
    : '• No open issues';

  const taskLines=doneTasks.length
    ? doneTasks.slice(0,12).map(t=>`• ${t.text||t.title||'Task'}`).join('\n')
    : '• No tasks completed';

  const openTaskLines=openTasks.length
    ? openTasks.slice(0,12).map(t=>`• ${t.text||t.title||'Task'}`).join('\n')
    : '• None';

  return `Dear ${name},

Here’s the daily briefing for ${S.propertyName||'the environment'} — ${date}.

TODAY
• Rooms planned: ${allRooms.length}
• Rooms ready: ${ready}
• Rooms worked on: ${worked}
• Tasks completed: ${doneTasks.length}
• Reminders completed: ${doneRem.length}
${priority.length?`• Priority rooms: ${priority.join(', ')}`:''}

ISSUES
${issueLines}

TASKS COMPLETED
${taskLines}

OPEN TASKS
${openTaskLines}

Best,
${S.userName||'The team'}`;
}
