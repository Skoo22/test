<html lang="en"><head><meta charset="utf-8">

<style>
:root{--card:#fff;--soft:#eef1f5;--soft2:#e9ecf1;--navbg:rgba(255,255,255,.96);--bg:#f5f6f8;--ink:#18202a;--mu:#7b8490;--ln:#e7e9ed;--bl:#4f7cff;--bl2:#eaf0ff;--gr:#25a66a;--gr2:#e8f7ef;--or2:#fff3df;--rd:#df5b5b;--rd2:#fdecec;--pu2:#efeaff;--sh:0 8px 28px rgba(25,35,55,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--card:#1c222b;--soft:#28303b;--soft2:#232a34;--navbg:rgba(28,34,43,.96);--bg:#12171d;--ink:#e8ecf1;--mu:#8f99a6;--ln:#2b333d;--bl2:#1f2d52;--gr2:#17332a;--rd2:#3a2020;--pu2:#2c2650;--sh:none}}:root[data-theme=dark]{--card:#1c222b;--soft:#28303b;--soft2:#232a34;--navbg:rgba(28,34,43,.96);--bg:#12171d;--ink:#e8ecf1;--mu:#8f99a6;--ln:#2b333d;--bl2:#1f2d52;--gr2:#17332a;--rd2:#3a2020;--pu2:#2c2650;--sh:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:900px;margin:auto;padding:0 14px 96px;padding-top:env(safe-area-inset-top)}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 0 10px}.title{font-size:25px;font-weight:800}.date{font-size:13px;color:var(--mu)}
.icon{width:43px;height:43px;border:1px solid var(--ln);border-radius:14px;background:var(--card);font-size:18px;margin-left:6px}
.page{display:none}.page.on{display:block}
.hero,.panel,.list,.stat{background:var(--card);border:1px solid var(--ln);border-radius:18px;box-shadow:var(--sh)}
.hero{padding:18px;margin-bottom:14px}.hero h2{margin:0 0 5px;font-size:20px}.hero p,.meta{color:var(--mu);font-size:12px;margin:0}.meta{margin-top:3px}
.btn{background:var(--bl);color:#fff;border:0;border-radius:13px;padding:11px 15px;font-weight:700}.btn.s{background:var(--soft);color:var(--ink)}.btn.g{background:var(--gr)}.btn.r{background:var(--rd)}.btn.f{width:100%;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{cursor:pointer;text-align:left;transition:transform .08s,background .08s;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:13px;box-shadow:var(--sh)}.metric:active{transform:scale(.98);background:var(--soft)}.metric b{display:block;font-size:24px;margin-top:6px}.metric span{font-size:11px;color:var(--mu)}
.sec{margin-top:20px}.sec h3{font-size:16px;margin:0 0 8px}.list{overflow:hidden}.panel{padding:14px}
.row{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.no{font-size:18px;font-weight:800}
.pill{padding:5px 8px;border-radius:9px;font-size:10px;font-weight:800;white-space:nowrap}

.seg{display:flex;background:var(--soft2);padding:3px;border-radius:12px;overflow:auto;margin-bottom:12px}.seg button{background:none;border:0;padding:8px 10px;border-radius:9px;font-size:11px;white-space:nowrap}.seg .on{background:var(--card);font-weight:800}
.chk{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln)}.chk input{width:22px;height:22px}
.mini{border:0;background:var(--soft);border-radius:9px;padding:8px 10px;font-size:11px;font-weight:700}.mini.on{background:var(--bl);color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--navbg);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:30}
.nav button{border:0;background:none;color:var(--mu);font-size:10px;padding:6px}.nav b{display:block;font-size:19px}.nav .on{color:var(--bl);font-weight:800}
.ov{display:none;position:fixed;inset:0;background:rgba(18,24,34,.42);z-index:60;align-items:flex-end}.ov.on{display:flex}
.sheet{width:min(680px,100%);margin:auto;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.sh{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0;font-size:21px}.x{width:34px;height:34px;border:0;border-radius:50%;background:var(--soft);font-size:18px}
.fld{margin-top:10px}.fld label{display:block;font-size:11px;color:var(--mu);font-weight:700;margin-bottom:4px}.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--ln);background:var(--soft);border-radius:10px;padding:10px}.fld textarea{min-height:70px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:15px}.stat b{font-size:25px}.stat p{margin:4px 0 0;font-size:11px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:93px;transform:translateX(-50%);background:#17202a;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.on{opacity:1}
.brief{display:none;position:fixed;inset:0;background:var(--bg);z-index:80;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}.brief.on{display:block}.bbox{max-width:560px;margin:auto}.bbox h1{font-size:28px;margin:0 0 4px}.big{font-size:34px;font-weight:850;margin:14px 0 2px}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}}

<style id="v6-polish">
  :root { -webkit-tap-highlight-color: transparent; }

  button, a, input, select, textarea { touch-action:manipulation; }
  button { min-height:42px; }
  .card, .room-card, .summary-card, .stat-card { transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease; }
  button:active, .card:active, .room-card:active, .summary-card:active { transform:scale(.985); }
  input, select, textarea { font-size:16px; } /* prevents iOS Safari zoom */
  textarea { resize:vertical; }
  .v6-empty { padding:24px 16px; text-align:center; color:#6b7280; }
  .v6-priority { font-weight:700; }
  .v6-save-ok { animation:v6save .35s ease; }
  @keyframes v6save { 0%{opacity:.55; transform:scale(.98)} 100%{opacity:1; transform:scale(1)} }
</style>
</head><body>
<div class="app">
<header class="top"><div><div class="title" id="title">Home</div><div class="date" id="date"></div></div><div><button class="icon" onclick="quick()">＋</button><button class="icon" onclick="setup()">⚙</button></div></header>
<section id="home" class="page on"></section>
<section id="rooms" class="page"></section>
<section id="plan" class="page"></section>
<section id="tasks" class="page"></section>
<section id="issues" class="page"></section>
<section id="reminders" class="page"></section>

</div>
<nav class="nav"><button data-p="home" class="on" onclick="go('home')"><b>⌂</b>Home</button><button data-p="rooms" onclick="go('rooms')"><b>▦</b>Rooms</button><button data-p="plan" onclick="go('plan')"><b>◷</b>Plan</button><button data-p="tasks" onclick="go('tasks')"><b>✓</b>Tasks</button><button data-p="stats" onclick="go('stats')"><b>⌁</b>Stats</button></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div><div class="brief" id="brief"></div>
<script>
const KEY='stay365_pwa_v5_2',FL=[['G','Ground'],['1','1st floor'],['2','2nd floor']],CHK=['Bed made, linen fresh','Bathroom clean, towels set','Floors vacuumed / washed','Surfaces dusted, no marks','Trash out, amenities restocked','Nothing broken or left behind'],ST={todo:'To do',clean:'Cleaning',insp:'To inspect',fix:'Fix needed',ready:'Ready'};
const blank=()=>({propertyName:'',hk:['Housekeeper 1','Housekeeper 2'],floors:{G:[],1:[],2:[]},day:'',brief:'',planReady:false,plan:{},today:{},hist:[],issues:[],tasks:[],reminders:[]});
let S,cur='home',flt='all',pf='tomorrow';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{let raw=localStorage.getItem(KEY)||localStorage.getItem('stay365_pwa_v5')||'{}',o=JSON.parse(raw);return Object.assign(blank(),o,{planReady:!!o.planReady})}catch(e){return blank()}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function toast(m){let t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
function roll(){let d=new Date().toDateString();if(S.day!==d){S.today={};for(const r in S.plan)S.today[r]=Object.assign({},S.plan[r],{st:'todo',f:0});S.plan={};S.planReady=false;S.tasks=S.tasks.filter(t=>!t.done);S.reminders=S.reminders.filter(r=>!r.done);S.day=d;save()}}
const rooms=()=>FL.flatMap(([f])=>S.floors[f].map(n=>({n,f})));
const floorOf=n=>(rooms().find(r=>r.n===n)||{}).f;
const owner=f=>f==='1'?S.hk[0]:f==='2'?S.hk[1]:'Shared';
const list=()=>Object.keys(S.today).map(n=>Object.assign({n,f:floorOf(n)},S.today[n])).sort((a,b)=>rooms().findIndex(r=>r.n===a.n)-rooms().findIndex(r=>r.n===b.n));
const tl=t=>t==='D'?'Departure':'Stayover',el=r=>Math.max(1,Math.floor((Date.now()-r.s)/60000)),pill=r=>`<span class="pill ${r.st}">${ST[r.st]}</span>`;
function go(p){cur=p;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.p===p));$('title').textContent={home:'Home',rooms:'Rooms',plan:'Plan',tasks:'Tasks',issues:'Issues',stats:'Stats',reminders:'Reminders'}[p];render();scrollTo(0,0)}
function rrow(r){let m=r.st==='clean'?el(r)+' min so far':r.st==='fix'?esc(r.fx):owner(r.f);return `<div class="row" onclick="openRoom('${r.n}')"><div class="no">${esc(r.n)}</div><div><strong>${tl(r.t)}${r.p?' · Priority':''}</strong><div class="meta">${m}</div></div>${pill(r)}</div>`}
function render(){$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
let L=list(),rd=L.filter(r=>r.st==='ready').length,oi=S.issues.filter(i=>i.open),ot=S.tasks.filter(t=>!t.done),or=S.reminders.filter(r=>!r.done).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
// home
let prog=[['1',S.hk[0]+' · 1st floor'],['2',S.hk[1]+' · 2nd floor'],['G','Ground floor · shared']].map(([f,l])=>{let a=L.filter(r=>r.f===f);return a.length?`<div class="row"><div></div><div><strong>${esc(l)}</strong><div class="meta">${a.filter(r=>r.st==='ready').length} of ${a.length} ready</div></div></div>`:''}).join('');
let q=L.filter(r=>r.st==='insp'||r.st==='fix');
$('home').innerHTML=`<div class="hero">${S.propertyName?`<div class="eyebrow">${esc(S.propertyName)}</div>`:''}<h2>${L.length?`${rd} of ${L.length} rooms ready`:'No rooms planned for today'}</h2><p>${L.filter(r=>r.t==='D').length} departures · ${L.filter(r=>r.t==='S').length} stayovers${S.planReady?' · ✓ Tomorrow was prepared':' '}</p>${L.length?'':'<button class="btn f" onclick="go(\'plan\')">Plan rooms</button>'}${!S.propertyName?'<button class="btn s f" onclick="setup()">Set property name</button>':''}<button class="btn s f" onclick="dailySummary()">Export daily summary</button><button class="btn s f" onclick="showBrief()">Daily briefing</button></div>
<div class="grid"><div class="metric" onclick="go('rooms')"><span>🧹 Ready</span><b>${rd}/${L.length}</b><small class="meta">Rooms →</small></div><div class="metric" onclick="go('issues')"><span>⚠️ Issues</span><b>${oi.length}</b><small class="meta">Attention →</small></div><div class="metric" onclick="go('tasks')"><span>✅ Tasks</span><b>${ot.length}</b><small class="meta">To do →</small></div><div class="metric" onclick="go('reminders')"><span>🔔 Reminders</span><b>${S.reminders.filter(x=>!x.done).length}</b><small class="meta">Today →</small></div></div>
${Object.keys(S.plan).length?`<div class="panel" style="margin-top:12px;cursor:pointer" onclick="go('plan')"><strong>Tomorrow</strong><div class="meta" style="margin-top:4px">${Object.values(S.plan).filter(r=>r.t).length} rooms planned · ${S.planReady?'✓ Ready':'Still needs planning'} · Tap to review</div></div>`:''}
${prog?`<div class="sec"><h3>Progress</h3><div class="list">${prog}</div></div>`:''}
${q.length?`<div class="sec"><h3>Waiting for you</h3><div class="list">${q.map(rrow).join('')}</div></div>`:''}
${oi.length||ot.length||or.length?`<div class="sec"><h3>Needs attention</h3><div class="list">${oi.slice(0,3).map(i=>`<div class="row"><div class="no">${esc(i.room||'—')}</div><div><strong>${esc(i.text)}</strong><div class="meta">${i.pr}</div></div></div>`).join('')}${ot.slice(0,3).map(t=>`<div class="row"><div>✓</div><div><strong>${esc(t.text)}</strong><div class="meta">${esc(t.time)}</div></div></div>`).join('')}</div></div>`:''}`;
// rooms
let fs=[['all','All'],['todo','To do'],['clean','Cleaning'],['insp','To inspect'],['fix','Fix needed'],['ready','Ready']];
$('rooms').innerHTML=`<div class="seg">${fs.map(([k,l])=>`<button class="${flt===k?'on':''}" onclick="flt='${k}';render()">${l}</button>`).join('')}</div>${L.length?`<div class="list">${L.filter(r=>flt==='all'||r.st===flt).map(rrow).join('')||'<div class="row"><div></div><div class="meta">No rooms with this status.</div></div>'}</div>`:'<div class="hero"><h2>Nothing planned</h2><p>Mark departures and stayovers in Plan.</p></div>'}`;
// plan
let P=pf==='today'?S.today:S.plan;
let planned=Object.entries(P).filter(([n,r])=>r.t),dep=planned.filter(([n,r])=>r.t==='D'),stay=planned.filter(([n,r])=>r.t==='S'),pri=planned.filter(([n,r])=>r.p),notes=planned.filter(([n,r])=>r.note&&r.note.trim());
let H2=S.hist.slice(-120),avgFor=t=>{let a=H2.filter(x=>x.t===t&&x.m);return a.length?Math.round(a.reduce((s,x)=>s+x.m,0)/a.length):0},est=avgFor('D')*dep.length+avgFor('S')*stay.length;
$('plan').innerHTML=`<div class="seg"><button class="${pf==='tomorrow'?'on':''}" onclick="pf='tomorrow';render()">Tomorrow</button><button class="${pf==='today'?'on':''}" onclick="pf='today';render()">Today</button></div>
<div class="hero"><h2>${pf==='tomorrow'?'Prepare tomorrow':"Today's plan"}</h2><p>${pf==='tomorrow'?'Set the workload tonight. The morning briefing will use this plan.':'Changes here apply to today right away.'}</p><div class="grid" style="margin-top:12px"><div class="metric"><span>🧹 Rooms</span><b>${planned.length}</b><small class="meta">${dep.length} departures · ${stay.length} stayovers</small></div><div class="metric"><span>★ Priority</span><b>${pri.length}</b><small class="meta">rooms</small></div><div class="metric"><span>📝 Notes</span><b>${notes.length}</b><small class="meta">special instructions</small></div><div class="metric"><span>⏱️ Est.</span><b>${est?est+'m':'—'}</b><small class="meta">from your history</small></div></div>${pf==='tomorrow'?`<button class="btn ${S.planReady?'g':'f'}" onclick="togglePlanReady()">${S.planReady?'✓ Tomorrow is ready':'✓ Mark tomorrow ready'}</button>${S.planReady?'<div class="meta" style="margin-top:8px">Plan ready — you can still edit it anytime.</div>':''}`:''}</div>
${rooms().length?FL.map(([f,l])=>S.floors[f].length?`<div class="sec" style="margin-top:14px"><h3>${l} · ${owner(f)}</h3><div class="list">${S.floors[f].map(n=>planRow(n,P)).join('')}</div></div>`:'').join(''):'<div class="hero"><h2>Add your rooms first</h2><button class="btn f" onclick="setup()">Open setup</button></div>'}`;
function planRow(n,P){let p=P[n]||{},note=p.note&&p.note.trim();let state=p.t?esc(p.t==='D'?'Departure':'Stayover'):'Not planned';return `<div class="row" style="grid-template-columns:48px 1fr auto"><div class="no">${esc(n)}</div><div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="mini ${p.t==='D'?'on':''}" onclick="setPlan('${n}','D')">Departure</button><button class="mini ${p.t==='S'?'on':''}" onclick="setPlan('${n}','S')">Stayover</button>${p.t?`<button class="mini ${p.p?'on':''}" onclick="setPri('${n}')">★ Priority</button>`:''}</div><div class="meta" style="margin-top:7px">${note?'📝 '+esc(note):state+(p.t?' · Add a special note if needed':'')}</div></div>${p.t?`<button class="mini" onclick="editPlanNote('${n}')">${note?'Edit':'Note'}</button>`:''}</div>`}
// tasks
$('tasks').innerHTML=`<div class="hero"><h2>Tasks</h2><p>Done tasks clear themselves the next morning.</p><button class="btn f" onclick="addTask()">＋ Add task</button></div><div class="list">${S.tasks.map((t,k)=>`<div class="row" onclick="S.tasks[${k}].done=!S.tasks[${k}].done;save();render()"><div class="no">${t.done?'✅':'⬜'}</div><div><strong style="${t.done?'text-decoration:line-through;color:#8b929b':''}">${esc(t.text)}</strong><div class="meta">${esc(t.time)}</div></div></div>`).join('')||'<div class="row"><div></div><div class="meta">No tasks.</div></div>'}</div>`;
// issues
$('issues').innerHTML=`<div class="hero"><h2>Issues</h2><button class="btn f" onclick="addIssue()">＋ Report issue</button></div><div class="list">${S.issues.map((i,k)=>`<div class="row"><div class="no">${esc(i.room||'—')}</div><div><strong>${esc(i.text)}</strong><div class="meta">${i.pr} · ${esc(i.when)}</div></div>${i.open?`<button class="mini on" onclick="S.issues[${k}].open=false;S.issues[${k}].fixedAt=Date.now();save();render()">Fixed</button>`:'<span class="pill ready">Fixed</span>'}</div>`).join('')||'<div class="row"><div></div><div class="meta">No issues.</div></div>'}</div>`;
// reminders
$('reminders').innerHTML=`<div class="hero"><h2>Reminders</h2><p>Time-based reminders for today.</p><button class="btn f" onclick="addReminder()">＋ Add reminder</button></div><div class="list">${S.reminders.map((r,k)=>`<div class="row" onclick="S.reminders[${k}].done=!S.reminders[${k}].done;save();render()"><div class="no">${r.done?'✅':'🔔'}</div><div><strong style="${r.done?'text-decoration:line-through;color:#8b929b':''}">${esc(r.text)}</strong><div class="meta">${esc(r.time||'No time')}</div></div></div>`).join('')||'<div class="row"><div></div><div class="meta">No reminders.</div></div>'}</div>`;
// stats
let H=S.hist.slice(-120),av=t=>{let a=H.filter(x=>x.t===t&&x.m);return a.length?Math.round(a.reduce((s,x)=>s+x.m,0)/a.length)+' min':'—'},D=H.filter(x=>x.t==='D'),fp=D.length?Math.round(D.filter(x=>!x.f).length/D.length*100)+'%':'—',turn=D.filter(x=>x.turn);
let avgTurn=turn.length?Math.round(turn.reduce((s,x)=>s+x.turn,0)/turn.length)+' min':'—',by={};H.forEach(x=>(by[x.room]??=[]).push(x.m));
let sl=Object.entries(by).map(([r,v])=>[r,Math.round(v.reduce((a,b)=>a+b,0)/v.length),v.length]).sort((a,b)=>b[1]-a[1]).slice(0,5);
$('stats').innerHTML=`<div class="stats"><div class="stat"><b>${av('D')}</b><p>Average departure clean</p></div><div class="stat"><b>${av('S')}</b><p>Average stayover clean</p></div><div class="stat"><b>${avgTurn}</b><p>Average departure turnaround</p></div><div class="stat"><b>${fp}</b><p>Departures passed first time</p></div><div class="stat"><b>${H.length}</b><p>Rooms logged (last 120)</p></div><div class="stat"><b>${S.issues.filter(i=>!i.open).length}</b><p>Issues fixed</p></div></div>${sl.length?`<div class="sec"><h3>Slowest rooms</h3><div class="list">${sl.map(([r,a,c])=>`<div class="row"><div class="no">${esc(r)}</div><div><strong>${a} min average</strong></div><span class="meta">${c} jobs</span></div>`).join('')}</div></div>`:''}`}

function sheet(h){$('sheet').innerHTML=h;$('ov').classList.add('on')}const close=()=>$('ov').classList.remove('on');$('ov').onclick=e=>{if(e.target.id==='ov')close()};
const head=t=>`<div class="sh"><h2>${t}</h2><button class="x" onclick="close()">×</button></div>`;
function setPlan(n,t){let P=pf==='today'?S.today:S.plan;if(P[n]&&P[n].t===t)delete P[n];else P[n]=Object.assign(P[n]||{p:false,note:''},{t},pf==='today'&&!(P[n]&&P[n].st)?{st:'todo',f:0}:{});if(pf==='tomorrow')S.planReady=false;save();render()}
function setPri(n){let P=pf==='today'?S.today:S.plan;if(!P[n]||!P[n].t)return;P[n].p=!P[n].p;if(pf==='tomorrow')S.planReady=false;save();render()}
function editPlanNote(n){let P=pf==='today'?S.today:S.plan;if(!P[n]||!P[n].t)return;sheet(`${head('Room '+esc(n)+' note')}<div class="fld"><label>Special cleaning / operational note</label><textarea id="a1" maxlength="180" placeholder="e.g. Extra towels, baby cot, check shower drain...">${esc(P[n].note||'')}</textarea></div><button class="btn f" onclick="savePlanNote('${n}')">Save note</button>${P[n].note?`<button class="btn s f" onclick="clearPlanNote('${n}')">Remove note</button>`:''}`)}
function savePlanNote(n){let P=pf==='today'?S.today:S.plan;if(P[n])P[n].note=$('a1').value.trim();if(pf==='tomorrow')S.planReady=false;save();close();render();toast('Room note saved')}
function clearPlanNote(n){let P=pf==='today'?S.today:S.plan;if(P[n])P[n].note='';if(pf==='tomorrow')S.planReady=false;save();close();render();toast('Note removed')}
function togglePlanReady(){if(!Object.values(S.plan).some(r=>r.t)){toast('Plan at least one room first');return}S.planReady=!S.planReady;save();render();toast(S.planReady?'Tomorrow is ready ✓':'Tomorrow marked as editable')}
function openRoom(n){let r=S.today[n],a='';
if(r.st==='todo')a=`<button class="btn f" onclick="act('${n}','start')">Start cleaning</button>`;
else if(r.st==='clean')a=`<button class="btn f" onclick="act('${n}','finish')">Finish cleaning</button>`;
else if(r.st==='insp')a=`<div class="panel" style="margin-top:12px"><h3 style="margin:0 0 4px;font-size:15px">Inspection</h3>${CHK.map((c,i)=>`<label class="chk"><input type="checkbox" class="ck" data-i="${i}"> ${c}</label>`).join('')}</div><button class="btn g f" onclick="inspect('${n}',true)">Pass → Ready</button><button class="btn r f" onclick="inspect('${n}',false)">Fail → send back</button>`;
else if(r.st==='fix')a=`<div class="panel" style="margin-top:12px"><strong>To fix</strong><div class="meta">${esc(r.fx)}</div></div><button class="btn f" onclick="act('${n}','reinsp')">Fixed → inspect again</button>`;
else a=`<button class="btn s f" onclick="act('${n}','redo')">Re-clean room</button>`;
sheet(`${head('Room '+esc(n))}<div class="meta">${tl(r.t)} · ${owner(floorOf(n))}${r.f?' · failed '+r.f+'×':''} ${pill(r)}</div>${a}<button class="btn s f" onclick="close();addIssue('${n}')">Report issue for this room</button>`)}
function act(n,w){let r=S.today[n];if(w==='start'||w==='redo'){r.st='clean';r.s=Date.now();r.started=r.started||r.s}
else if(w==='finish'){r.finished=Date.now();r.m=Math.max(1,Math.floor((r.finished-r.s)/60000));r.st=r.t==='D'?'insp':'ready';if(r.st==='ready'){r.ready=r.finished;done(n)}}
else if(w==='reinsp'){r.st='insp';r.reinspect=Date.now()}save();close();render();toast(w==='start'?'Cleaning started':'Saved')}
function done(n){let r=S.today[n];if(r.h)return;r.h=1;r.ready=r.ready||Date.now();let turn=r.t==='D'&&r.started?Math.max(0,Math.floor((r.ready-r.started)/60000)):0;S.hist.push({d:S.day,room:n,t:r.t,m:r.m||0,f:r.f||0,started:r.started||0,finished:r.finished||0,inspected:r.inspected||0,ready:r.ready||0,turn})}
function inspect(n,pass){let r=S.today[n],u=[...document.querySelectorAll('.ck')].filter(c=>!c.checked).map(c=>CHK[c.dataset.i]);
if(pass){if(u.length)return toast('Tick every item to pass');r.inspected=Date.now();r.st='ready';r.ready=Date.now();done(n)}
else{if(!u.length)return toast('Untick what failed');r.inspected=Date.now();r.f=(r.f||0)+1;r.fx=u.join('; ');r.st='fix'}
save();close();render();toast(pass?'Room '+n+' ready ✓':'Sent back')}
function addIssue(room=''){sheet(`${head('Report issue')}<div class="fld"><label>Room / area</label><input id="a1" value="${esc(room)}"></div><div class="fld"><label>Problem</label><input id="a2"></div><div class="fld"><label>Priority</label><select id="a3"><option>Normal</option><option>Urgent</option><option>Low</option></select></div><button class="btn f" onclick="saveIssue()">Save issue</button>`)}
function saveIssue(){let t=$('a2').value.trim();if(!t)return toast('Describe the problem');S.issues.unshift({room:$('a1').value.trim(),text:t,pr:$('a3').value,open:true,when:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});save();close();render();toast('Issue added')}
function addTask(){sheet(`${head('Add task')}<div class="fld"><label>Task</label><input id="a1"></div><div class="fld"><label>Time (optional)</label><input id="a2" type="time"></div><button class="btn f" onclick="saveTask()">Add task</button>`)}
function saveTask(){let t=$('a1').value.trim();if(!t)return toast('Write the task');S.tasks.push({text:t,time:$('a2').value||'No time',done:false});save();close();render()}
function addReminder(){sheet(`${head('Add reminder')}<div class="fld"><label>Reminder</label><input id="a1"></div><div class="fld"><label>Time</label><input id="a2" type="time"></div><button class="btn f" onclick="saveReminder()">Add reminder</button>`)}
function saveReminder(){let t=$('a1').value.trim();if(!t)return toast('Write the reminder');S.reminders.push({text:t,time:$('a2').value||'No time',done:false});save();close();render();toast('Reminder added')}
function quick(){sheet(`${head('Quick add')}<button class="btn s f" onclick="addTask()">✓ Task</button><button class="btn s f" onclick="addIssue()">⚠️ Issue</button><button class="btn s f" onclick="addReminder()">🔔 Reminder</button><button class="btn s f" onclick="close();go('plan')">🧹 Plan rooms</button>`)}

function dailySummary(){
  const recipient=prompt('Who is this summary for?','');
  if(recipient===null) return;
  const name=recipient.trim()||'there';
  const today=new Date();
  const date=today.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  const rooms=Array.isArray(S.today?.rooms)?S.today.rooms:(Array.isArray(S.plan?.rooms)?S.plan.rooms:[]);
  const allRooms=Array.isArray(rooms)?rooms:[];
  const cleaned=allRooms.filter(r=>['ready','insp','clean'].includes((r.st||'').toLowerCase())).length;
  const ready=allRooms.filter(r=>(r.st||'').toLowerCase()==='ready').length;
  const openIssues=Array.isArray(S.issues)?S.issues.filter(i=>!i.done):[];
  const doneTasks=Array.isArray(S.tasks)?S.tasks.filter(t=>t.done):[];
  const openTasks=Array.isArray(S.tasks)?S.tasks.filter(t=>!t.done):[];
  const doneRem=Array.isArray(S.reminders)?S.reminders.filter(t=>t.done):[];

  const issueLines=openIssues.length
    ? openIssues.slice(0,12).map(i=>`• ${i.room?`Room ${i.room} — `:''}${i.title||i.text||i.problem||'Issue'}`).join('\n')
    : '• No open issues';

  const taskLines=doneTasks.length
    ? doneTasks.slice(0,12).map(t=>`• ${t.title||t.text||'Task'}`).join('\n')
    : '• No tasks completed';

  const summary =
`Dear ${name},

Here’s a summary of today at ${S.propertyName||'the property'} (${date}).

TODAY
• Rooms planned: ${allRooms.length}
• Rooms completed/ready: ${ready}
• Rooms worked on: ${cleaned}
• Tasks completed: ${doneTasks.length}
• Reminders completed: ${doneRem.length}

ISSUES
${issueLines}

TASKS COMPLETED
${taskLines}

${openTasks.length?`OPEN TASKS\n${openTasks.slice(0,12).map(t=>`• ${t.title||t.text||'Task'}`).join('\n')}\n`:''}
Best,
${S.propertyName||'Housekeeping Planner'}`;

  // Native iOS share sheet where available; otherwise copy to clipboard.
  if(navigator.share){
    navigator.share({title:`Daily summary — ${date}`,text:summary}).catch(()=>{});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(summary).then(()=>alert('Daily summary copied to clipboard.')).catch(()=>downloadSummary(summary));
  }else{
    downloadSummary(summary);
  }
}
function downloadSummary(text){
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`daily-summary-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function setup(){sheet(`${head('Setup')}<div class="fld"><label>Property / hotel name</label><input id="prop" placeholder="e.g. My Hotel" value="${esc(S.propertyName||'')}"></div><div class="fld"><label>Housekeeper on 1st floor</label><input id="h0" value="${esc(S.hk[0])}"></div><div class="fld"><label>Housekeeper on 2nd floor</label><input id="h1" value="${esc(S.hk[1])}"></div>${FL.map(([f,l])=>`<div class="fld"><label>${l} rooms (separate with commas)</label><input id="fl${f}" value="${esc(S.floors[f].join(', '))}"></div>`).join('')}<button class="btn f" onclick="saveSetup()">Save setup</button>
<div class="fld" style="margin-top:22px"><label>Backup — copy this text somewhere safe, or paste a backup here and restore</label><textarea id="bk">${esc(JSON.stringify(S))}</textarea></div><button class="btn s f" onclick="copyBackup()">Copy backup</button><button class="btn s f" onclick="restore()">Restore from pasted backup</button><button class="btn s f" onclick="if(confirm('Clear today\\'s list and statuses?')){S.today={};save();close();render()}">Clear today</button>`)}
function saveSetup(){S.propertyName=$('prop').value.trim();S.hk=[$('h0').value.trim()||'Housekeeper 1',$('h1').value.trim()||'Housekeeper 2'];FL.forEach(([f])=>S.floors[f]=[...new Set($('fl'+f).value.split(/[,\s]+/).filter(Boolean))]);save();close();render();toast('Setup saved')}
async function copyBackup(){let v=$('bk').value;try{await navigator.clipboard.writeText(v);toast('Backup copied')}catch(e){$('bk').focus();$('bk').select();try{document.execCommand('copy');toast('Backup copied')}catch(e2){toast('Select and copy the backup')}}}
function restore(){try{let o=JSON.parse($('bk').value);if(!o.floors)throw 0;S=Object.assign(blank(),o);save();close();roll();render();toast('Backup restored')}catch(e){toast('That is not a valid backup')}}

function showBrief(){let L=list(),D=L.filter(r=>r.t==='D').length,pr=L.filter(r=>r.p).map(r=>r.n),oi=S.issues.filter(i=>i.open),ot=S.tasks.filter(t=>!t.done),hr=new Date().getHours(),g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
let fl=[['1',S.hk[0]+' · 1st floor'],['2',S.hk[1]+' · 2nd floor'],['G','Ground floor · shared']].map(([f,l])=>{let a=L.filter(r=>r.f===f);return a.length?`<div class="row" style="grid-template-columns:1fr auto"><strong>${esc(l)}</strong><span class="meta">${a.filter(r=>r.t==='D').length} dep · ${a.filter(r=>r.t==='S').length} stay</span></div>`:''}).join('');
$('brief').innerHTML=`<div class="bbox"><h1>${g}</h1><div class="meta">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
${L.length?`<div class="big">${L.length} rooms today</div><div class="meta">${D} departures · ${L.length-D} stayovers</div>${fl?`<div class="list" style="margin-top:14px">${fl}</div>`:''}
${pr.length?`<div class="sec"><h3>Priority rooms</h3><div class="panel"><strong>${pr.map(esc).join(', ')}</strong><div class="meta">Do these first.</div></div></div>`:''}${L.filter(r=>r.note).length?`<div class="sec"><h3>Special room notes</h3><div class="list">${L.filter(r=>r.note).map(r=>`<div class="row"><div class="no">${esc(r.n)}</div><div><strong>${esc(r.note)}</strong></div></div>`).join('')}</div></div>`:''}`:`<div class="hero" style="margin-top:14px"><h2>No rooms planned yet</h2><p>Mark today's departures and stayovers in Plan.</p></div>`}
${oi.length?`<div class="sec"><h3>Open issues</h3><div class="list">${oi.slice(0,4).map(i=>`<div class="row"><div class="no">${esc(i.room||'—')}</div><div><strong>${esc(i.text)}</strong><div class="meta">${i.pr}</div></div></div>`).join('')}</div></div>`:''}
${ot.length?`<div class="sec"><h3>Tasks</h3><div class="list">${ot.slice(0,4).map(t=>`<div class="row" style="grid-template-columns:1fr auto"><strong>${esc(t.text)}</strong><span class="meta">${esc(t.time)}</span></div>`).join('')}</div></div>`:''}
<button class="btn f" onclick="closeBrief('${L.length?'rooms':'plan'}')">${L.length?'Start the day':'Plan rooms'}</button></div>`;$('brief').classList.add('on')}
function closeBrief(p){$('brief').classList.remove('on');S.brief=S.day;save();go(p||cur)}
S=load();S.reminders=S.reminders||[];S.tasks=S.tasks||[];S.issues=S.issues||[];roll();render();if(!rooms().length)setup();else if(S.brief!==S.day)showBrief();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script id="v6-hardening">
(function(){
  // Keep a tiny, versioned local snapshot in addition to the app's existing state.
  const SNAP_KEY='stay365_v6_last_snapshot';
  const APP_KEYS=['stay365','stay365Data','stay365_state','stay365Planner'];
  function snapshot(){
    try{
      const data={savedAt:new Date().toISOString(), localStorage:{}};
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && (k.toLowerCase().includes('stay365') || APP_KEYS.includes(k))){
          data.localStorage[k]=localStorage.getItem(k);
        }
      }
      if(Object.keys(data.localStorage).length) localStorage.setItem(SNAP_KEY,JSON.stringify(data));
    }catch(e){}
  }
  window.addEventListener('pagehide',snapshot);
  window.addEventListener('beforeunload',snapshot);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')snapshot();});
  // Make accidental form submits less destructive.
  document.addEventListener('submit',e=>{ if(e.target && e.target.tagName==='FORM') e.preventDefault(); }, true);
})();
</script>
